<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Willify: describe the moment, hear it</title>
    <meta
      name="description"
      content="Willify is an AI music DJ: describe a moment and get a playlist of real songs from the iTunes catalogue, checked one by one, with instant 30-second previews. No account, no Premium."
    />
    <meta name="theme-color" content="#09080F" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Willify: describe the moment, hear it" />
    <meta
      property="og:description"
      content="An AI music DJ that only plays real songs. Instant previews, no account."
    />
    <meta property="og:image" content="/media/og.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Set the theme before first paint so there is no flash.
      try {
        const s = JSON.parse(localStorage.getItem('willify-settings') || '{}').state || {}
        const t = s.theme || 'system'
        const dark =
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
